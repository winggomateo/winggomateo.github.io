    <body class="body">
        <div class="wrapper">
            <!-- Navigation (same on every page; the current page gets id="clicked") -->
            <nav class="sidebar">
                <input type="checkbox" class="toggler" aria-label="Open menu" />
                <div class="hamburger"><div></div></div>
                <div class="menu">
                    <div>
                        <div>
                            <ul>
                                <li><a href="index.html" class="home-link" aria-label="Home"><span class="home-shape" aria-hidden="true"></span><span class="home-label">Home</span></a></li>

                                <li><a href="mailto:design@mateovr.com">Email</a></li>
                                <li><a href="https://www.instagram.com/mateovr.design/">Instagram</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- Email icon at the bottom of the sidebar (desktop only) -->
            <a class="side-email" href="mailto:design@mateovr.com" aria-label="Email design@mateovr.com"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" /><path d="M2 5 L12 13 L22 5" /></svg></a>

            <!-- Main Content -->
            <main class="main-content">
                <div class="block3">
                    <div class="container4">
                        <img
                            class="cover"
                            src="photo/photo1.jpg"
                            srcset="photo/photo1-2x.jpg 2x"
                            alt="Two friends sitting on a park bench in the sun" />
                    </div>
                    <div class="container4">
                        <img
                            class="cover"
                            src="photo/photo2.jpg"
                            srcset="photo/photo2-2x.jpg 2x"
                            alt="Person in a blue cap standing at night under a streetlight" />
                    </div>
                    <div class="container4">
                        <img
                            class="cover"
                            src="photo/photo3.jpeg"
                            srcset="photo/photo3-2x.jpeg 2x"
                            alt="Football player in a helmet pointing at the camera on a field"
                            loading="lazy" />
                    </div>
                    <div class="container4">
                        <img
                            class="cover"
                            src="photo/photo4.jpg"
                            srcset="photo/photo4-2x.jpg 2x"
                            alt="Person in a bucket hat eating from a pizza box on a bench"
                            loading="lazy" />
                    </div>
                    <div class="container4">
                        <img
                            class="cover"
                            src="photo/photo5.jpg"
                            srcset="photo/photo5-2x.jpg 2x"
                            alt="Man lounging in an office chair against a white wall"
                            loading="lazy" />
                    </div>
                    <div class="container4">
                        <img
                            class="cover"
                            src="photo/photo6.jpg"
                            srcset="photo/photo6-2x.jpg 2x"
                            alt="Tattooed man sitting on a bench in the sun"
                            loading="lazy" />
                    </div>
                    <div class="container4">
                        <img
                            class="cover"
                            src="photo/photo7.jpg"
                            srcset="photo/photo7-2x.jpg 2x"
                            alt="Man in a face mask standing on a sidewalk holding a bicycle wheel"
                            loading="lazy" />
                    </div>
                    <div class="container4">
                        <img
                            class="cover"
                            src="photo/photo8.jpg"
                            srcset="photo/photo8-2x.jpg 2x"
                            alt="Fire hydrant in a grassy clearing surrounded by trees"
                            loading="lazy" />
                    </div>
                    <div class="container4">
                        <img
                            class="cover"
                            src="photo/photo9.jpeg"
                            srcset="photo/photo9-2x.jpeg 2x"
                            alt="Close-up of a football player in a helmet with a mirrored visor"
                            loading="lazy" />
                    </div>
                </div>
            </main>
        </div>

        <!-- Footer (same on every page) -->
        <footer>
            <p class="bottom"><em>Designed &amp; Built by Mateo</em></p>
            <p class="bottom"><a href="mailto:design@mateovr.com">design@mateovr.com</a></p>
            <p class="bottom"><a href="https://dribbble.com/winggomateo">Dribbble</a></p>
            <p class="bottom"><a href="https://www.instagram.com/mateovr.design/">Instagram</a></p>
        </footer>

        <!-- Film grain effect -->
        <canvas id="noise" class="noise"></canvas>
        <script src="js/noise.js"></script>
